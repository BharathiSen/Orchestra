name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # The real image, not plain postgres: the schema has a vector(384) column
      # and retrieval orders by cosine distance, so a stock Postgres would fail
      # to create the table and the retrieval tests would be skipped silently.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: orchestra
          POSTGRES_PASSWORD: orchestra
          POSTGRES_DB: orchestra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orchestra"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: python -m ruff check .

      - name: Compile all sources
        # Catches syntax errors in modules the test suite never imports.
        run: python -m compileall -q app scripts

      - name: Run tests
        env:
          # TEST_DATABASE_URL switches the suite off SQLite and onto pgvector, so
          # the `requires_pgvector` tests run here instead of being skipped.
          TEST_DATABASE_URL: postgresql+psycopg2://orchestra:orchestra@localhost:5432/orchestra_test
          REDIS_URL: redis://localhost:6379/0
          # Makes conftest refuse to start if the suite is not actually on
          # PostgreSQL, so retrieval can never be silently untested here.
          REQUIRE_PGVECTOR: "1"
        run: python -m pytest tests/

      - name: Verify the pgvector guard actually guards
        # The guard is only useful if it fires. Running without a PostgreSQL URL
        # must fail; if this step ever succeeds, the guard has stopped working.
        env:
          REQUIRE_PGVECTOR: "1"
        run: |
          if python -m pytest tests/ --collect-only > guard.log 2>&1; then
            echo "::error::REQUIRE_PGVECTOR=1 on SQLite should have failed the run, but did not"
            exit 1
          fi
          echo "guard correctly refused to run the suite without pgvector"

      - name: Startup checks reject unsafe production config
        # Guards the fail-fast behaviour that protects a real deployment: if this
        # ever stops raising, a default signing key could reach production.
        env:
          ENVIRONMENT: production
          JWT_SECRET: dev-secret-change-me
        run: |
          python - <<'PY'
          import sys
          from app.core.config import Settings
          from app.core.startup_checks import StartupCheckError, run_startup_checks

          try:
              run_startup_checks(Settings())
          except StartupCheckError:
              print("startup checks correctly refused the default secret")
              sys.exit(0)
          print("ERROR: production booted with the default JWT secret")
          sys.exit(1)
          PY

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        env:
          # Inlined at build time; the values only need to be well-formed here.
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_OUTPUT: standalone
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: runtime
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
            NEXT_PUBLIC_SITE_URL=http://localhost:3000
          cache-from: type=gha
          cache-to: type=gha,mode=max
