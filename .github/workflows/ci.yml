name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all sources
        # Catches syntax errors in modules the test suite never imports.
        run: python -m compileall -q app scripts

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg2://orchestra:orchestra@localhost:5432/orchestra
          REDIS_URL: redis://localhost:6379/0
        run: python -m pytest tests/ -q

      - name: Startup checks reject unsafe production config
        # Guards the fail-fast behaviour that protects a real deployment: if this
        # ever stops raising, a default signing key could reach production.
        env:
          ENVIRONMENT: production
          JWT_SECRET: dev-secret-change-me
        run: |
          python - <<'PY'
          import sys
          from app.core.config import Settings
          from app.core.startup_checks import StartupCheckError, run_startup_checks

          try:
              run_startup_checks(Settings())
          except StartupCheckError:
              print("startup checks correctly refused the default secret")
              sys.exit(0)
          print("ERROR: production booted with the default JWT secret")
          sys.exit(1)
          PY

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        env:
          # Inlined at build time; the values only need to be well-formed here.
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_OUTPUT: standalone
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: runtime
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
            NEXT_PUBLIC_SITE_URL=http://localhost:3000
          cache-from: type=gha
          cache-to: type=gha,mode=max
